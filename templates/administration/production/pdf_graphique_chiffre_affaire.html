<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4 landscape; margin: 2cm 1.5cm; }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #222; }
  h1 { font-size: 14pt; margin: 0 0 4px 0; }
  .periode { font-size: 9pt; color: #555; margin-bottom: 16px; }
  .chart { text-align: center; margin-top: 12px; }
  .chart img { width: 26cm; }
</style>
</head>
<body>
  <h1>{{ titre }}</h1>
  <div class="periode">
    Période : {{ date_debut|date:'d/m/Y' }} &rarr; {{ date_fin|date:'d/m/Y' }}
    &nbsp;&middot;&nbsp; Généré le {{ genere_le|date:'d/m/Y H:i' }}
  </div>

  <div class="chart">
    <img src="data:image/png;base64,{{ chart_b64 }}">
  </div>
</body>
</html>
