<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code de connexion — Gestion Pâtisseries</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a1d23 0%, #2c3354 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .login-card .card-header {
      background: #2c7be5;
      border-radius: 1rem 1rem 0 0;
      padding: 2rem 1.5rem 1.5rem;
      border: none;
    }
    .login-card .card-body { padding: 2rem 1.5rem; }
    .login-logo {
      width: 60px; height: 60px;
      background: rgba(255,255,255,.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
    }
    .form-control:focus { box-shadow: 0 0 0 .2rem rgba(44,123,229,.25); border-color: #2c7be5; }
    .btn-connexion {
      background: #2c7be5;
      border-color: #2c7be5;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .btn-connexion:hover { background: #1a6fd4; border-color: #1a6fd4; }
    .code-input {
      letter-spacing: .6em;
      font-size: 1.5rem;
      text-align: center;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="login-card card">

  <div class="card-header text-center text-white">
    <div class="login-logo">
      <i class="bi bi-envelope-check fs-3 text-white"></i>
    </div>
    <h5 class="mb-0 fw-bold">Vérification en 2 étapes</h5>
    <small class="opacity-75">Code envoyé à {{ email_masque }}</small>
  </div>

  <div class="card-body">

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_code" class="form-label fw-semibold">Code à 6 chiffres</label>
        <input type="text"
               id="id_code"
               name="code"
               class="form-control code-input"
               placeholder="······"
               maxlength="6"
               inputmode="numeric"
               pattern="[0-9]*"
               autocomplete="one-time-code"
               autofocus
               required>
        <div class="form-text">Valable 5 minutes.</div>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-connexion btn-primary">
          <i class="bi bi-check-circle me-2"></i>Je confirme
        </button>
      </div>
    </form>

    <form method="post" class="d-flex justify-content-between mt-3">
      {% csrf_token %}
      <button type="submit" name="renvoyer" value="1" class="btn btn-link btn-sm p-0">
        Renvoyer le code
      </button>
      <button type="submit" name="annuler" value="1" class="btn btn-link btn-sm p-0 text-muted">
        Annuler
      </button>
    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
